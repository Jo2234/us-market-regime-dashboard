name: Refresh market and macro snapshots
on:
  schedule:
    # Two after-close builds plus a next-day FRED publication refresh.
    - cron: '45 20 * * 1-5'
    - cron: '30 22 * * 1-5'
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yahoo-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python scripts/refresh_snapshot.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Commit changed observations
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/data/yahoo_snapshot.json backend/app/data/fred_snapshot.json backend/app/data/regime_history.json backend/app/data/dashboard_artifact.json.gz
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh market and macro snapshots'
            git pull --rebase origin main
            git push origin main
          fi
