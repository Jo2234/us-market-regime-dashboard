name: Refresh Yahoo snapshot
on:
  schedule:
    # 22:35 UTC is after the US close in both EST and EDT.
    - cron: '35 22 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yahoo-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python scripts/refresh_snapshot.py
      - name: Commit changed observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/data/yahoo_snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Yahoo market snapshot'
            git pull --rebase origin main
            git push origin main
          fi
