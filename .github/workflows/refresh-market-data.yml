name: Refresh market and macro snapshots
# Title carries the optional dispatch reason so scripts/dispatch_watchdog.py can
# correlate its request with the run. The input is never used in a shell step.
run-name: ${{ inputs.reason && format('Refresh market and macro snapshots ({0})', inputs.reason) || 'Refresh market and macro snapshots' }}
on:
  schedule:
    # Best-effort fallback only: observed scheduled starts ran 2h45m-4h55m late,
    # beyond the 2h delivery window. Off-peak minutes may reduce, not remove, delay.
    # 21:17 and 22:37 UTC follow the 16:00 ET close in both EDT (20:00 UTC) and
    # EST (21:00 UTC); 14:07 UTC picks up next-day FRED publications. Early closes
    # rely on the independent watchdog (docs/refresh-watchdog.md).
    - cron: '17 21 * * 1-5'
    - cron: '37 22 * * 1-5'
    - cron: '7 14 * * 1-5'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Audit label, e.g. watchdog:close-2026-10-02-a'
        required: false
        default: ''
        type: string
permissions:
  contents: write
concurrency:
  group: yahoo-snapshot
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - id: refresh
        run: python scripts/refresh_snapshot.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Validate artifact and manifest
        id: validate
        if: always()
        run: python scripts/build_daily_artifact.py --check
      - name: Commit changed observations
        # A failed provider still publishes the other provider's real observations
        # (the run stays red), but never an artifact that fails validation.
        if: always() && steps.validate.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/data/yahoo_snapshot.json backend/app/data/fred_snapshot.json backend/app/data/regime_history.json backend/app/data/dashboard_artifact.json.gz backend/app/data/dashboard_artifact.meta.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh market and macro snapshots'
            git pull --rebase origin main
            git push origin main
          fi
